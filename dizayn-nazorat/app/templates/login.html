{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block bare %}
<div class="auth-wrap">
  <form class="card auth-card" method="post" action="/login">
    <div class="brand"><span class="logo">DN</span> Dizayn Nazorat</div>
    <h1 style="margin-bottom:4px">Tizimga kirish</h1>
    <p class="muted" style="margin:0 0 18px">Dizaynerlar ishini nazorat qilish tizimi</p>
    {% if error %}<div class="alert error mb">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <div class="field mb">
      <label for="username">Login</label>
      <input class="input" id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
    </div>
    <div class="field mb">
      <label for="password">Parol</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" style="width:100%;height:40px">Kirish</button>
  </form>
</div>
{% endblock %}
