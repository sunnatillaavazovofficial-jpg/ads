name: Build Windows dasturlar (exe)

on:
  push:
    paths:
      - "ai-yordamchi/**"
      - "dock-panel/**"
      - ".github/workflows/build-ai-yordamchi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-yordamchi/requirements.txt -r dock-panel/requirements.txt pyinstaller
      - name: Build AI Yordamchi
        working-directory: ai-yordamchi
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "AI-Yordamchi" --icon assets/icon.ico app.py
      - name: Build Dock Panel
        working-directory: dock-panel
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "Dock-Panel" --icon assets/icon.ico app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-exe
          path: |
            ai-yordamchi/dist/AI-Yordamchi.exe
            dock-panel/dist/Dock-Panel.exe
      - name: Publish release (download without login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-yordamchi-v${{ github.run_number }}
          name: AI Yordamchi + Dock Panel v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            **AI-Yordamchi.exe**: tarjima, grammatika, yangi alifbo, kirill, inglizcha qidiruv,
            skrinshot (PrintScreen / Win+Shift+S), sifatni oshirish va AI real rasm.
            **Dock-Panel.exe**: taskbar o'rnida turadigan shaffof dok-panel.
          files: |
            ai-yordamchi/dist/AI-Yordamchi.exe
            dock-panel/dist/Dock-Panel.exe
